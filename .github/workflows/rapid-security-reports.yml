name: Multi-Repo Rapid Security Assessments

# Mirrors generate-reports.yml: one job per target calling the reusable gh-aw lock.
on:
  schedule:
    - cron: '0 14 1 * *' # 1st of month 14:00 UTC (avoids Monday 08:00 UTC FDS audits)
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  copilot-requests: write

jobs:
  assess-nr-fom:
    name: Assess nr-fom
    permissions:
      contents: read
      actions: read
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/rapid-security-assessment.prompt.lock.yml
    with:
      target_repository: bcgov/nr-fom
    secrets: inherit

  assess-nr-hydrometric-rating-curve:
    name: Assess nr-hydrometric-rating-curve
    permissions:
      contents: read
      actions: read
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/rapid-security-assessment.prompt.lock.yml
    with:
      target_repository: bcgov/nr-hydrometric-rating-curve
    secrets: inherit

  assess-nr-results-exam:
    name: Assess nr-results-exam
    permissions:
      contents: read
      actions: read
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/rapid-security-assessment.prompt.lock.yml
    with:
      target_repository: bcgov/nr-results-exam
    secrets: inherit

  assess-nr-seedtransfer-map:
    name: Assess nr-seedtransfer-map
    permissions:
      contents: read
      actions: read
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/rapid-security-assessment.prompt.lock.yml
    with:
      target_repository: bcgov/nr-seedtransfer-map
    secrets: inherit

  assess-pubcode:
    name: Assess pubcode
    permissions:
      contents: read
      actions: read
      issues: write
      copilot-requests: write
    uses: ./.github/workflows/rapid-security-assessment.prompt.lock.yml
    with:
      target_repository: bcgov/pubcode
    secrets: inherit

  collect:
    name: Collect Assessments
    needs: [assess-nr-fom, assess-nr-hydrometric-rating-curve, assess-nr-results-exam, assess-nr-seedtransfer-map, assess-pubcode]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*rapid-security"
          path: reports

      - name: List Assessments
        run: find reports -type f | sort
