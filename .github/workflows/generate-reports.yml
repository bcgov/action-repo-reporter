name: Multi-Repo Code Quality Audits

on:
  schedule:
    - cron: '0 8 * * 1' # Runs at 8:00 AM UTC every Monday
  workflow_dispatch: # Allows manual trigger

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  copilot-requests: write

jobs:
  audit-quickstart-openshift:
    name: Audit quickstart-openshift
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/quickstart-openshift
    secrets: inherit

  audit-pubcode:
    name: Audit pubcode
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/pubcode
    secrets: inherit

  audit-actions:
    name: Audit actions
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/actions
    secrets: inherit

  # Downstream job that collects the reports and opens or updates a single PR
  commit-reports:
    name: Collect and Commit Reports
    needs: [audit-quickstart-openshift, audit-pubcode, audit-actions]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Central Reporting Repo
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8

      - name: Organize Reports
        run: |
          set -euo pipefail
          mkdir -p reports
          
          echo "=== Downloaded Artifact Files ==="
          find . -type f
          
          # 1. Copy any explicitly named *-code-quality-assessment.md files if present
          find . -name "*-code-quality-assessment.md" -exec cp -v {} reports/ \;
          
          # 2. Extract generated audit reports from gh-aw agent_output.json items
          python3 -c '
          import json, glob, os

          mapping = {
              "quickstart-openshift": "reports/quickstart-openshift-code-quality-assessment.md",
              "pubcode": "reports/pubcode-code-quality-assessment.md",
              "actions": "reports/actions-code-quality-assessment.md"
          }

          for json_path in glob.glob("./**/*-agent/agent_output.json", recursive=True):
              try:
                  with open(json_path) as f:
                      data = json.load(f)
                  for item in data.get("items", []):
                      body = item.get("body", "")
                      title = item.get("title", "")
                      for key, target_path in mapping.items():
                          if key in json_path.lower() or key in title.lower() or key in body.lower():
                              with open(target_path, "w") as out:
                                  out.write(body)
                              print(f"Extracted {target_path} from {json_path}")
              except Exception as e:
                  print(f"Error processing {json_path}: {e}")
          '

      - name: Open or Update Reports PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/code-quality-reports
          base: main
          add-paths: reports/
          commit-message: "chore: update code quality assessments"
          title: "chore: update code quality assessments"
          body: Automated code quality assessment reports from the Multi-Repo Code Quality Audits workflow.
          delete-branch: true
