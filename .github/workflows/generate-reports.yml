name: Multi-Repo Security Assessments

# Single report pipeline. Selects the target set (all five by default, or an
# optional repos filter), calls the reusable security assessment
# once per target, then commit-reports collects artifacts into
# reports/<repo>/ and opens/updates one reports PR.
# Former FDS Full-Stack Project Audit is removed; stack checks live in the scripted assessor.
#
# User-facing entrypoint: this workflow only. The assessor is workflow_call-only.
# workflow_call exists so PR CI can dry-run it (dry_run skips publishing);
# dry_run is deliberately absent from the dispatch form.
on:
  schedule:
    - cron: '0 14 1 * *' # 1st of month 14:00 UTC (off the old Monday 08:00 UTC slot)
  workflow_dispatch:
    inputs:
      repos:
        description: >-
          Optional comma-separated subset (e.g. `repo1, repo2`).  Omitting runs all.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      repos:
        description: >-
          Optional comma-separated subset (e.g. `repo1, repo2`).  Omitting runs all.
        required: false
        default: ""
        type: string
      dry_run:
        description: Assess and validate artifacts only; never open or update the reports PR.
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  select-targets:
    name: Select targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - name: Resolve target list
        id: pick
        env:
          REPOS_INPUT: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          ALL='["bcgov/nr-fom","bcgov/nr-hydrometric-rating-curve","bcgov/nr-results-exam","bcgov/nr-seedtransfer-map","bcgov/pubcode"]'
          if [ -z "${REPOS_INPUT//[[:space:]]/}" ]; then
            echo "targets=$ALL" >> "$GITHUB_OUTPUT"
            echo "count=$(echo "$ALL" | jq 'length')" >> "$GITHUB_OUTPUT"
            echo "Using full test set ($ALL)"
            exit 0
          fi
          # Accept owner/name or bare name; normalize bare → bcgov/<name>.
          selected="$(
            printf '%s' "$REPOS_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk '
              NF {
                if ($0 ~ /^[^\/]+\/[^\/]+$/) print $0
                else if ($0 ~ /^[A-Za-z0-9._-]+$/) print "bcgov/" $0
                else { print "BAD:" $0 > "/dev/stderr"; exit 1 }
              }'
          )"
          # Keep only names that appear in ALL (by full slug or bare suffix).
          targets="$(
            echo "$ALL" | jq -c --arg raw "$(printf '%s' "$selected" | paste -sd, -)" '
              ($raw | split(",") | map(select(length>0))) as $want
              | map(select(
                  . as $r
                  | ($want | index($r) != null)
                    or ($want | index($r | split("/")[1]) != null)
                ))
            '
          )"
          count="$(echo "$targets" | jq 'length')"
          if [ "$count" -eq 0 ]; then
            echo "::error::repos filter matched nothing. Input='$REPOS_INPUT'. Allowed: $ALL"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count target(s): $targets"

  assess:
    name: Assess ${{ matrix.target_repository }}
    needs: select-targets
    strategy:
      fail-fast: false
      matrix:
        target_repository: ${{ fromJSON(needs.select-targets.outputs.targets) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/security-assessment.yml
    with:
      target_repository: ${{ matrix.target_repository }}
    secrets: inherit

  # Collect per-repo artifacts and open or update a single reports PR.
  # Fails loudly when nothing was organized — writing artifacts without a PR is not success.
  commit-reports:
    name: Collect and Commit Reports
    needs: [select-targets, assess]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Central Reporting Repo
        uses: actions/checkout@v7

      - name: Download All Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "*security-assessment"
          path: artifacts
          merge-multiple: false

      # Keep unmerged reports from the shared PR branch so a filtered `repos=`
      # run does not wipe sibling targets still awaiting merge on that branch.
      - name: Preserve pending reports from open PR branch
        run: |
          set -euo pipefail
          git fetch origin chore/security-reports:refs/remotes/origin/chore/security-reports 2>/dev/null || true
          if git rev-parse --verify refs/remotes/origin/chore/security-reports >/dev/null 2>&1; then
            git checkout origin/chore/security-reports -- reports/ 2>/dev/null \
              && echo "Restored pending reports/ from chore/security-reports" \
              || echo "No reports/ on pending branch (ok)"
          else
            echo "No pending chore/security-reports branch (ok)"
          fi

      - name: Organize Reports
        id: organize
        env:
          ASSESS_RESULT: ${{ needs.assess.result }}
        run: |
          set -euo pipefail
          # Failed preflight/substance gates must never publish even if diagnostic artifacts exist.
          if [ "$ASSESS_RESULT" != "success" ]; then
            echo "::error::Assessment failed ($ASSESS_RESULT); refusing to publish diagnostic/stale reports"
            exit 1
          fi
          mkdir -p artifacts
          find artifacts -type f 2>/dev/null | sort || true
          organized=0
          # Each artifact holds one target's reports/; key by findings.json repository.
          # Require all three publish files nonempty before counting the set.
          while IFS= read -r -d '' f; do
            dir="$(dirname "$f")"
            repo="$(jq -r '.repository // empty' "$f")"
            name="${repo##*/}"
            if [ -z "$name" ] || ! printf '%s' "$name" | grep -Eq '^[A-Za-z0-9._-]+$'; then
              echo "::warning::skipping $f (bad repository field)"; continue
            fi
            missing=0
            for g in findings.json score.json security-assessment.md; do
              if [ ! -s "$dir/$g" ]; then
                echo "::warning::skipping $repo — missing or empty $g"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              continue
            fi
            out="reports/$name"
            mkdir -p "$out"
            for g in findings.json score.json security-assessment.md; do
              cp -vf "$dir/$g" "$out/$g"
            done
            if [ -s "$dir/cover-letter.md" ]; then
              cp -vf "$dir/cover-letter.md" "$out/cover-letter.md"
            else
              # Never publish a stale digest restored from an earlier report.
              rm -f "$out/cover-letter.md"
            fi
            organized=$((organized + 1))
          done < <(find artifacts -type f -path "*/reports/findings.json" -print0 2>/dev/null || true)

          echo "organized=$organized" >> "$GITHUB_OUTPUT"
          echo "Organized $organized report set(s) under reports/"
          if [ "$organized" -eq 0 ]; then
            echo "::error::No security reports organized from artifacts — refusing to succeed (noop/artifact-only is not a publish)"
            exit 1
          fi

      - name: Resolve Artifact URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          server_url="${{ github.server_url }}"
          server_repo="${{ github.repository }}"
          run_id="${{ github.run_id }}"
          gh api "/repos/$server_repo/actions/runs/$run_id/artifacts" --jq '
            [ .artifacts[] | { (.name): ("'"$server_url/$server_repo/actions/runs/$run_id/artifacts/"'" + (.id | tostring)) } ] | add // {}
          ' > .tmp/artifacts.json 2>/dev/null || echo "{}" > .tmp/artifacts.json

      - name: Render Executive Dashboard to workflow summary
        run: |
          set -euo pipefail
          python3 scripts/render-dashboard-summary.py reports --artifact-map .tmp/artifacts.json >> "$GITHUB_STEP_SUMMARY"

      - name: Open or Update Reports PR
        id: cpr
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/security-reports
          base: main
          add-paths: reports/
          commit-message: "chore: update security assessments"
          title: "chore: update security assessments"
          body: Automated security assessment reports from the Multi-Repo Security Assessments workflow.
          delete-branch: true

      - name: Link Reports PR in summary
        if: ${{ !inputs.dry_run && steps.cpr.outputs.pull-request-number != '' && steps.cpr.outputs.pull-request-number != '0' }}
        run: |
          set -euo pipefail
          num="${{ steps.cpr.outputs.pull-request-number }}"
          server_url="${{ github.server_url }}"
          server_repo="${{ github.repository }}"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Reports Pull Request: [#${num}](${server_url}/${server_repo}/pull/${num})" >> "$GITHUB_STEP_SUMMARY"

      - name: Require publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          # peter-evans outputs: pull-request-number / pull-request-operation (created|updated|closed|false)
          op="${{ steps.cpr.outputs.pull-request-operation }}"
          num="${{ steps.cpr.outputs.pull-request-number }}"
          organized="${{ steps.organize.outputs.organized }}"
          echo "CPR operation=$op number=$num organized=$organized"
          if [ -z "$num" ] || [ "$op" = "false" ] || [ -z "$op" ]; then
            # No PR only acceptable when files already match main (updated content identical).
            # If organize copied files but git has no diff, still OK — content already published.
            if git diff --quiet HEAD -- reports/ && [ -z "$(git ls-files --others --exclude-standard reports/)" ]; then
              echo "Reports already on main (no diff) — publish path satisfied."
              exit 0
            fi
            echo "::error::create-pull-request did not open/update a PR (operation='$op') after organizing $organized report set(s)"
            exit 1
          fi
          echo "Published via PR #$num ($op)"
