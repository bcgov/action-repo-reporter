name: Multi-Repo Code Quality Audits

on:
  schedule:
    - cron: '0 8 * * 1' # Runs at 8:00 AM UTC every Monday
  workflow_dispatch: # Allows manual trigger

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: write
  copilot-requests: write

jobs:
  audit-quickstart-openshift:
    name: Audit quickstart-openshift
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/quickstart-openshift
    secrets: inherit

  audit-pubcode:
    name: Audit pubcode
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/pubcode
    secrets: inherit

  audit-actions:
    name: Audit actions
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      copilot-requests: write
    uses: ./.github/workflows/fds-project-audit.prompt.lock.yml
    with:
      target_repository: bcgov/actions
    secrets: inherit

  # Downstream job that collects the reports and opens or updates a single PR
  commit-reports:
    name: Collect and Commit Reports
    needs: [audit-quickstart-openshift, audit-pubcode, audit-actions]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Central Reporting Repo
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8

      - name: Organize Reports
        run: |
          set -euo pipefail
          mkdir -p reports
          
          echo "=== Downloaded Artifact Files ==="
          find . -type f
          
          # Copy any explicitly named *-code-quality-assessment.md files from downloaded artifacts
          find . -type f -name "*-code-quality-assessment.md" ! -path "./reports/*" -exec cp -vf {} reports/ \;

      - name: Open or Update Reports PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/code-quality-reports
          base: main
          add-paths: reports/
          commit-message: "chore: update code quality assessments"
          title: "chore: update code quality assessments"
          body: Automated code quality assessment reports from the Multi-Repo Code Quality Audits workflow.
          delete-branch: true
