name: CI

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-workflows:
    name: Validate Workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Require scripted assessor workflow
        run: |
          set -euo pipefail
          test -f .github/workflows/security-assessment.yml
          test -f .github/workflows/generate-reports.yml
          test -f scripts/compile-findings.py
          test -f scripts/render-report.py
          test -f scripts/write-digest.py
          test -f scripts/render-dashboard-summary.py
          # Prompt/lock must not remain as the findings author.
          if [ -f .github/workflows/rapid-security-assessment.prompt.md ] || [ -f .github/workflows/rapid-security-assessment.prompt.lock.yml ]; then
            echo "::error::gh-aw prompt/lock still present; scripted assessor replaces Copilot authorship"
            exit 1
          fi
          # Basic workflow_call-only check on the assessor
          if grep -q 'workflow_dispatch' .github/workflows/security-assessment.yml; then
            echo "::error::security-assessment.yml must stay workflow_call-only"
            exit 1
          fi
          grep -q 'compile-findings.py' .github/workflows/security-assessment.yml
          grep -q 'render-report.py' .github/workflows/security-assessment.yml
          echo "Scripted assessor workflow present and call-only"


  security-quality:
    name: Security quality regression tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Test evidence and chapter-substance gates
        run: python3 -m unittest discover -s tests -v

      - name: Install isolated Semgrep (same path as assessment runner)
        run: bash scripts/install-semgrep.sh

      - name: Smoke test real Semgrep runtime and usable findings
        run: |
          set -euo pipefail
          cp tests/semgrep-smoke.py "$RUNNER_TEMP/semgrep-smoke.py"
          bash scripts/run-semgrep.sh "$RUNNER_TEMP/semgrep-evidence" "$RUNNER_TEMP/semgrep-smoke.py" tests/semgrep-smoke.yml
          jq -e '.results | any(.check_id | endswith("smoke-eval"))' "$RUNNER_TEMP/semgrep-evidence/semgrep.json"

      # The assessment calls run-semgrep.sh without a config; test that exact path.
      - name: Smoke test default Semgrep config (no override, metrics off)
        run: |
          set -euo pipefail
          bash scripts/run-semgrep.sh "$RUNNER_TEMP/semgrep-default" "$RUNNER_TEMP/semgrep-smoke.py"
          jq -e '.results | any(.check_id | endswith("eval-detected"))' "$RUNNER_TEMP/semgrep-default/semgrep.json"

  changes:
    name: Detect report pipeline changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      report: ${{ steps.diff.outputs.report }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0

      - name: Diff against base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(scripts/|tests/|\.github/workflows/(ci|generate-reports|security-assessment)\.yml$)'; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
          fi

  # Real assessment of public bcgov/nr-fom; dry_run never opens a reports PR.
  dry-run-reports:
    name: Dry-run reports (nr-fom)
    needs: changes
    # Forks and Dependabot get no secrets inherit, so they skip the live dry-run.
    if: >-
      needs.changes.outputs.report == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    # A called workflow cannot exceed the caller; match generate-reports.yml.
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/generate-reports.yml
    with:
      repos: nr-fom
      dry_run: true
    secrets: inherit

  # Required merge gate aggregator job
  results:
    name: CI Results
    needs: [validate-workflows, security-quality, changes, dry-run-reports]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: CI Results
        uses: bcgov/actions/workflow-results@d209bb08aabe15e5e69aca53b24d338a7b2843d5 # v0.12.0
        with:
          needs: ${{ toJson(needs) }}
